<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 780">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
</defs>

<rect width="100%" height="100%" fill="#0f172a"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- Title block -->
<text x="30" y="42" fill="white" font-size="18" font-weight="700">2026 AI Agent 工具定位圖</text>
<text x="30" y="62" fill="#94a3b8" font-size="10">X 軸：主要場景（寫 Code ←→ 幹雜活/通用助理）　Y 軸：記憶與自治度　顏色：模型自由度</text>

<!-- Axes -->
<line x1="120" y1="640" x2="1100" y2="640" stroke="#475569" stroke-width="1.5"/>
<line x1="120" y1="640" x2="120" y2="90" stroke="#475569" stroke-width="1.5"/>
<polygon points="1100,640 1088,635 1088,645" fill="#475569"/>
<polygon points="120,90 115,102 125,102" fill="#475569"/>
<text x="1090" y="662" fill="#64748b" font-size="9" text-anchor="end">通用助理 / 全天候自動化 →</text>
<text x="130" y="105" fill="#64748b" font-size="9">高：會記憶、自我成長 ↑</text>

<!-- Quadrant guides -->
<line x1="610" y1="640" x2="610" y2="90" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,4"/>
<line x1="120" y1="365" x2="1100" y2="365" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,4"/>

<!-- Quadrant labels -->
<text x="140" y="120" fill="#334155" font-size="10" font-weight="600">深度編碼 × 有記憶</text>
<text x="950" y="120" fill="#334155" font-size="10" font-weight="600" text-anchor="end">通用代理 × 有記憶</text>
<text x="140" y="620" fill="#334155" font-size="10" font-weight="600">深度編碼 × 靜態設定</text>
<text x="950" y="620" fill="#334155" font-size="10" font-weight="600" text-anchor="end">通用 / 消費級 × 靜態</text>

<!-- Tool boxes: mask layer first -->
<!-- Hermes (open 🔓 cyan, high memory, general) -->
<rect x="880" y="140" width="190" height="66" rx="6" fill="#0f172a"/>
<rect x="880" y="140" width="190" height="66" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="2"/>
<text x="975" y="164" fill="white" font-size="12" font-weight="700" text-anchor="middle">Hermes Agent</text>
<text x="975" y="180" fill="#94a3b8" font-size="9" text-anchor="middle">記憶+技能自學+cron+瀏覽器</text>
<text x="975" y="194" fill="#22d3ee" font-size="8" text-anchor="middle">🔓 任意 OpenAI 相容端點</text>

<!-- omp (open cyan, coding, has memory) -->
<rect x="200" y="250" width="170" height="62" rx="6" fill="#0f172a"/>
