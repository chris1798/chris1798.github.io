<rect x="620" y="530" width="170" height="62" rx="6" fill="#0f172a"/>
<rect x="620" y="530" width="170" height="62" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
<text x="705" y="552" fill="white" font-size="11" font-weight="600" text-anchor="middle">Antigravity CLI</text>
<text x="705" y="567" fill="#94a3b8" font-size="9" text-anchor="middle">原 Gemini CLI（已停服）</text>
<text x="705" y="581" fill="#fb7185" font-size="8" text-anchor="middle">🔒 Google、閉源 agy</text>

<!-- Claude Desktop (locked rose, consumer) -->
<rect x="880" y="430" width="190" height="62" rx="6" fill="#0f172a"/>
<rect x="880" y="430" width="190" height="62" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
<text x="975" y="452" fill="white" font-size="11" font-weight="600" text-anchor="middle">Claude Desktop</text>
<text x="975" y="467" fill="#94a3b8" font-size="9" text-anchor="middle">Cowork+Projects+MCP</text>
<text x="975" y="481" fill="#fb7185" font-size="8" text-anchor="middle">🔒 Anthropic、非編碼</text>

<!-- Legend -->
<rect x="120" y="690" width="980" height="60" rx="8" fill="rgba(30,41,59,0.5)" stroke="#334155" stroke-width="1"/>
<text x="140" y="712" fill="#94a3b8" font-size="9" font-weight="600">顏色＝模型自由度：</text>
<rect x="290" y="702" width="14" height="14" rx="3" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="312" y="713" fill="#cbd5e1" font-size="9">🔓 完全自由（OpenCode/omp/Pi/Hermes）</text>
<rect x="560" y="702" width="14" height="14" rx="3" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="582" y="713" fill="#cbd5e1" font-size="9">🎯 半自由（dsh）</text>
<rect x="690" y="702" width="14" height="14" rx="3" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
<text x="712" y="713" fill="#cbd5e1" font-size="9">🔒 綁家（Claude/Codex/Antigravity）</text>
<text x="140" y="736" fill="#64748b" font-size="9">選型三問：①要不要自由換模型？ ②要不要它記住你？ ③場景是寫 Code 還是幹雜活？　整理日期：2026-10-24</text>
</svg>
