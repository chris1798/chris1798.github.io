<rect x="410" y="470" width="170" height="62" rx="6" fill="#0f172a"/>
<rect x="410" y="470" width="170" height="62" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="495" y="492" fill="white" font-size="11" font-weight="600" text-anchor="middle">OpenCode</text>
<text x="495" y="507" fill="#94a3b8" font-size="9" text-anchor="middle">75+ providers、多 session</text>
<text x="495" y="521" fill="#22d3ee" font-size="8" text-anchor="middle">🔓 模型自由、TUI 精美</text>

<!-- Pi (open cyan, minimal) -->
<rect x="200" y="540" width="170" height="62" rx="6" fill="#0f172a"/>
<rect x="200" y="540" width="170" height="62" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="285" y="562" fill="white" font-size="11" font-weight="600" text-anchor="middle">Pi</text>
