<text x="495" y="351" fill="#fb7185" font-size="8" text-anchor="middle">🔒 Anthropic</text>

<!-- Codex CLI (locked rose, coding, security) -->
<rect x="200" y="420" width="170" height="62" rx="6" fill="#0f172a"/>
<rect x="200" y="420" width="170" height="62" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
