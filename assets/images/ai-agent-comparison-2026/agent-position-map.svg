<text x="285" y="591" fill="#22d3ee" font-size="8" text-anchor="middle">🔓 60+ providers</text>

<!-- DeepSeek Harness (half-open amber, coding) -->
<rect x="620" y="400" width="170" height="62" rx="6" fill="#0f172a"/>
<rect x="620" y="400" width="170" height="62" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="705" y="422" fill="white" font-size="11" font-weight="600" text-anchor="middle">DeepSeek Harness</text>
