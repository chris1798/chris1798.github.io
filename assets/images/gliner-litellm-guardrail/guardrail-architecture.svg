<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="40" fill="white" font-size="16" font-weight="700">GLiNER × LiteLLM Guardrail 攔截架構</text>
  <text x="30" y="60" fill="#94a3b8" font-size="10">電話自動遮罩 · 雙向還原 · 機密參數阻擋（RHEL 9 / podman / CPU）</text>

  <!-- podman region -->
  <rect x="600" y="90" width="380" height="560" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="612" y="108" fill="#fbbf24" font-size="10" font-weight="600">RHEL 9 · podman（quadlet 開機自啟 · fail_open）</text>

  <!-- arrows first -->
  <!-- user -> litellm -->
  <line x1="210" y1="380" x2="288" y2="380" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="212" y="368" fill="#22d3ee" font-size="8">① 原文送進 Proxy</text>

  <!-- litellm -> block (pre_call) -->
  <path d="M 380 330 C 380 200, 520 175, 618 175" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="430" y="212" fill="#fb7185" font-size="8">② pre_call 機密檢查</text>

  <!-- block hit -> BLOCKED box -->
  <path d="M 618 205 C 520 240, 470 250, 460 250 L 460 250" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-rose)"/>

  <!-- litellm -> mask (pre_call) -->
  <path d="M 458 360 C 520 360, 560 350, 618 350" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="470" y="348" fill="#34d399" font-size="8">③ pre_call 遮罩</text>

  <!-- mask <-> redis -->
  <line x1="705" y1="395" x2="705" y2="478" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-violet)"/>
  <text x="715" y="440" fill="#a78bfa" font-size="8">寫入映射 TTL 24h</text>

  <!-- mask -> gliner model -->
  <line x1="800" y1="350" x2="838" y2="350" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- block -> gliner model -->
  <path d="M 800 190 C 860 190, 905 250, 905 308" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- litellm -> LLM backend (masked) -->
  <path d="M 458 395 L 1040 395" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="820" y="385" fill="#34d399" font-size="8">④ 模型只看到 &lt;電話:763e97&gt; 佔位符</text>

  <!-- LLM -> litellm (response) -->
  <path d="M 1040 435 C 800 470, 560 445, 458 425" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="700" y="462" fill="#22d3ee" font-size="8">⑤ 回應含佔位符 → post_call 反查 Redis 還原</text>

  <!-- litellm -> user (return) -->
  <line x1="288" y1="410" x2="210" y2="410" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="212" y="428" fill="#22d3ee" font-size="8">⑥ 原文電話還原</text>

  <!-- masked box -->
  <line x1="458" y1="375" x2="618" y2="375" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="470" y="392" fill="#94a3b8" font-size="8">&lt;電話:763e97&gt;</text>

  <!-- component masks + boxes -->
  <!-- 使用者 -->
  <rect x="40" y="348" width="170" height="64" rx="6" fill="#0f172a"/>
  <rect x="40" y="348" width="170" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="125" y="374" fill="white" font-size="12" font-weight="600" text-anchor="middle">使用者 / Client</text>
  <text x="125" y="392" fill="#94a3b8" font-size="9" text-anchor="middle">貼上 0912-345678</text>

  <!-- LiteLLM Proxy -->
  <rect x="290" y="330" width="168" height="110" rx="6" fill="#0f172a"/>
  <rect x="290" y="330" width="168" height="110" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="374" y="356" fill="white" font-size="12" font-weight="600" text-anchor="middle">LiteLLM Proxy</text>
  <text x="374" y="374" fill="#94a3b8" font-size="9" text-anchor="middle">:4000 · DB 模式註冊</text>
  <text x="374" y="392" fill="#94a3b8" font-size="9" text-anchor="middle">pre_call / post_call</text>
  <text x="374" y="410" fill="#94a3b8" font-size="9" text-anchor="middle">default_on: true 全域</text>

  <!-- BLOCKED box -->
  <rect x="290" y="150" width="168" height="60" rx="6" fill="#0f172a"/>
  <rect x="290" y="150" width="168" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="374" y="176" fill="white" font-size="11" font-weight="600" text-anchor="middle">BLOCKED · HTTP 400</text>
  <text x="374" y="194" fill="#94a3b8" font-size="9" text-anchor="middle">偵測到機密內容: 機台RECIPE參數</text>

  <!-- gliner-block -->
  <rect x="620" y="140" width="180" height="70" rx="6" fill="#0f172a"/>
  <rect x="620" y="140" width="180" height="70" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="710" y="166" fill="white" font-size="11" font-weight="600" text-anchor="middle">gliner-block :5504</text>
  <text x="710" y="184" fill="#94a3b8" font-size="9" text-anchor="middle">公司機密 / RECIPE 參數</text>
  <text x="710" y="199" fill="#94a3b8" font-size="9" text-anchor="middle">命中 → 阻擋</text>

  <!-- gliner-mask -->
  <rect x="620" y="305" width="180" height="90" rx="6" fill="#0f172a"/>
  <rect x="620" y="305" width="180" height="90" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="710" y="331" fill="white" font-size="11" font-weight="600" text-anchor="middle">gliner-mask :5503</text>
  <text x="710" y="349" fill="#94a3b8" font-size="9" text-anchor="middle">電話/銀行帳號 → 佔位符</text>
  <text x="710" y="365" fill="#94a3b8" font-size="9" text-anchor="middle">token = SHA1 前6碼</text>
  <text x="710" y="381" fill="#94a3b8" font-size="9" text-anchor="middle">post_call 反查還原</text>

  <!-- Redis -->
  <rect x="620" y="480" width="180" height="70" rx="6" fill="#0f172a"/>
  <rect x="620" y="480" width="180" height="70" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="710" y="506" fill="white" font-size="11" font-weight="600" text-anchor="middle">Redis 映射表</text>
  <text x="710" y="524" fill="#94a3b8" font-size="9" text-anchor="middle">gliner:map:&lt;token&gt; → 原值</text>
  <text x="710" y="539" fill="#94a3b8" font-size="9" text-anchor="middle">TTL 24h · 同值同 token</text>

  <!-- GLiNER model -->
  <rect x="838" y="310" width="132" height="80" rx="6" fill="#0f172a"/>
  <rect x="838" y="310" width="132" height="80" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="904" y="336" fill="white" font-size="10" font-weight="600" text-anchor="middle">GLiNER NER</text>
  <text x="904" y="353" fill="#94a3b8" font-size="8" text-anchor="middle">gliner_multi_pii-v1</text>
  <text x="904" y="368" fill="#94a3b8" font-size="8" text-anchor="middle">零樣本 label · 繁中</text>
  <text x="904" y="383" fill="#94a3b8" font-size="8" text-anchor="middle">CPU &lt;1s</text>

  <!-- LLM backend -->
  <rect x="1042" y="345" width="164" height="110" rx="6" fill="#0f172a"/>
  <rect x="1042" y="345" width="164" height="110" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1124" y="373" fill="white" font-size="12" font-weight="600" text-anchor="middle">LLM 模型後端</text>
  <text x="1124" y="393" fill="#94a3b8" font-size="9" text-anchor="middle">全程看不見</text>
  <text x="1124" y="409" fill="#94a3b8" font-size="9" text-anchor="middle">原始電話 / 機密參數</text>

  <!-- Legend -->
  <rect x="40" y="690" width="1160" height="76" rx="8" fill="rgba(30,41,59,0.5)" stroke="#1e293b"/>
  <text x="60" y="716" fill="white" font-size="10" font-weight="600">圖例</text>
  <rect x="120" y="704" width="14" height="14" rx="3" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
  <text x="142" y="716" fill="#94a3b8" font-size="9">使用者流量</text>
  <rect x="240" y="704" width="14" height="14" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
  <text x="262" y="716" fill="#94a3b8" font-size="9">Proxy 管線</text>
  <rect x="360" y="704" width="14" height="14" rx="3" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/>
  <text x="382" y="716" fill="#94a3b8" font-size="9">Guardrail 攔截層</text>
  <rect x="510" y="704" width="14" height="14" rx="3" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
  <text x="532" y="716" fill="#94a3b8" font-size="9">儲存 / 模型</text>
  <rect x="640" y="704" width="14" height="14" rx="3" fill="rgba(30,41,59,0.5)" stroke="#94a3b8"/>
  <text x="662" y="716" fill="#94a3b8" font-size="9">NER 引擎</text>
  <text x="60" y="746" fill="#64748b" font-size="9">關鍵：同值同 token 的全域唯一佔位符，讓「遮罩後送模型」與「回應逐字還原」跨請求成立；fail_open 保證 guardrail 掛掉時可用性不受影響。</text>
</svg>
